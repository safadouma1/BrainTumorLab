[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "braintumorlab"
authors = [{ name = "Safa Douma" }]
version = "1.0.0"
description = "BrainTumorLab: BraTS 2020 preprocessing, analysis, 3D segmentation, radiomics, Med-DDPM generation and web interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "scipy", "nibabel", "matplotlib", "pillow", "opencv-python-headless",
  "scikit-image", "scikit-learn", "torch>=2.0", "monai>=1.3", "SimpleITK",
  "fastapi", "uvicorn", "python-multipart",
]

[project.optional-dependencies]
analysis = ["umap-learn"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"braintumorlab.webapp" = ["static/*", "static/vendor/*", "static/vendor/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
